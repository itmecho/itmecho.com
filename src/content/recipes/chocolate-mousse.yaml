---
title: Chocolate Mousse
description: |
  Simple recipe for a tasty dessert!
ingredients:
  - 200g dark chocolate (70%)
  - 90g unsalted butter
  - 6 large eggs
  - 95g granulated sugar
method:
  - Melt the butter and chocolate in a bain-marie. Once it's fully melted and combined, set aside to cool
  - Beat the egg yolks with 50g of the sugar until light and fluffy
  - Beat the egg whites for a minute or two then continue beating whilst slowly sprinkling in the remaining 45g of sugar until it reaches medium stiff peaks
  - Fold the egg yolk mixture into the butter/chocolate until fully combined
  - Gently fold in the egg whites until no white remains
  - Chill in the fridge to set and serve!
